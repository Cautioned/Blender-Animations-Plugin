schema_version = "1.0.0"

# Roblox Animations Blender Addon Manifest
id = "roblox_animations_importer_exporter"
version = "3.1.3"
name = "RBXMonkey - Roblox Importer/Exporter"
tagline = "Seamless animation workflow between Blender and Roblox Studio"
maintainer = "Cautioned"
type = "add-on"

# Offline Zstandard support for the Python runtimes used by Blender 4.2+.
wheels = [
    "./wheels/backports_zstd-1.8.0-cp311-cp311-macosx_10_9_x86_64.whl",
    "./wheels/backports_zstd-1.8.0-cp311-cp311-macosx_11_0_arm64.whl",
    "./wheels/backports_zstd-1.8.0-cp311-cp311-manylinux2014_aarch64.manylinux_2_17_aarch64.manylinux_2_28_aarch64.whl",
    "./wheels/backports_zstd-1.8.0-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl",
    "./wheels/backports_zstd-1.8.0-cp311-cp311-win_amd64.whl",
    "./wheels/backports_zstd-1.8.0-cp311-cp311-win_arm64.whl",
    "./wheels/backports_zstd-1.8.0-cp312-cp312-macosx_10_13_x86_64.whl",
    "./wheels/backports_zstd-1.8.0-cp312-cp312-macosx_11_0_arm64.whl",
    "./wheels/backports_zstd-1.8.0-cp312-cp312-manylinux2014_aarch64.manylinux_2_17_aarch64.manylinux_2_28_aarch64.whl",
    "./wheels/backports_zstd-1.8.0-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl",
    "./wheels/backports_zstd-1.8.0-cp312-cp312-win_amd64.whl",
    "./wheels/backports_zstd-1.8.0-cp312-cp312-win_arm64.whl",
    "./wheels/backports_zstd-1.8.0-cp313-cp313-macosx_10_13_x86_64.whl",
    "./wheels/backports_zstd-1.8.0-cp313-cp313-macosx_11_0_arm64.whl",
    "./wheels/backports_zstd-1.8.0-cp313-cp313-manylinux2014_aarch64.manylinux_2_17_aarch64.manylinux_2_28_aarch64.whl",
    "./wheels/backports_zstd-1.8.0-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl",
    "./wheels/backports_zstd-1.8.0-cp313-cp313-win_amd64.whl",
    "./wheels/backports_zstd-1.8.0-cp313-cp313-win_arm64.whl",
]

# Supported Blender versions
blender_version_min = "4.2.0"

# License information
license = [
  "SPDX:GPL-3.0-or-later",
]

# Copyright information
copyright = [
  "2025 Cautioned",
]

# Tags for categorization
tags = ["Animation", "Import-Export", "Rigging"]

# Permissions required by the addon
[permissions]
network = "Roblox OAuth and FileMesh asset requests"
files = "Import/export Roblox rig models and animation files"
clipboard = "Optionally used for import/export"
